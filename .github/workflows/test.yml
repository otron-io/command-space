name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test agent/local-gemma
